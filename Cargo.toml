[package]
name = "compass"
version = "0.1.0"
edition = "2021"
description = "Privacy-focused web browser built on Servo with Tor support"
license = "MPL-2.0"
repository = "https://github.com/marctjones/compass"

[dependencies]
# Transport layer
rigging = { git = "https://github.com/marctjones/rigging", features = ["unix", "tcp", "tor"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# CLI
clap = { version = "4", features = ["derive"] }

# URL parsing
url = "2"

[features]
default = ["tor"]
tor = ["rigging/tor"]

[dev-dependencies]
tempfile = "3"
